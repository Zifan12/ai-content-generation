# Apify credit-burn archive seeds.
#
# De-overlapped: each hashtag assigned to exactly ONE niche. Generic mega-tags
# (fyp, ai, aiart, aivideo, aigenerated, viral, foryou, anime, pov, scifi,
# history) are DROPPED — the live smoke-test manifest showed broad tags on
# nearly every video, so they maximize cross-hashtag duplication. Apify bills
# per item RETURNED (before our dedup), so a video returned under two seeded
# tags is paid for twice. Low-overlap, AI-qualified seeds = more unique videos
# per dollar and less hand-drawn / non-AI noise.
#
# Tag set validated by web research (2026-05-30): AI-tool tags (veo3, sora2,
# klingai, seedance, runwayml, pika) are the current top-tier AI-video tools
# and skew photorealistic. liminal/weirdcore/dreamcore is the live surreal
# aesthetic cluster. historical_pov, futuristic_pov, and AI anime short film
# confirmed as active niches via TikTok discover pages.
#
# Weighting reflects project priority: surreal_hyperreal is the primary niche
# (first TikTok account, P3.5 publish target). liminal_weirdcore is its
# surreal-family sibling. anime_ai is a likely second account (AI anime shorts).
# brainrot / horror_ai are reference niches for ablation. historical_pov,
# futuristic_pov, satisfying_ai are optionality for future per-category accounts.
seeds:
  # PRIMARY — photorealistic + impossible/uncanny. AI-tool tags live here
  # because top-tier generators (Veo 3, Sora 2, Kling) skew photoreal.
  - niche: surreal_hyperreal
    hashtags:
      - aisurreal
      - surrealai
      - hyperrealai
      - uncannyai
      - aihyperrealism
      - aireality
      - realisticai
      - uncannyvalley
      - veo3
      - sora2
      - klingai
      - seedanceai
      - runwayml
      - pikalabs

  # Surreal-family sibling — the live liminal/weirdcore/dreamcore aesthetic.
  - niche: liminal_weirdcore
    hashtags:
      - liminal
      - liminalspace
      - liminalspaces
      - dreamcore
      - weirdcore
      - backrooms
      - liminalcore
      - oddcore
      - strangecore
      - traumacore
      - feverdream
      - backroomsfound
      - glitchcore
      - deadmall
      - poolcore
      - voidcore

  # Likely second account — AI anime shorts. AI-qualified ONLY: the broad
  # tags (animeedit, animeclip, animefilter) are ~70% hand-drawn / official
  # anime, which would pollute an AI-generated corpus. Lower volume per tag is
  # the accepted tradeoff for clean training data.
  - niche: anime_ai
    hashtags:
      - aianime
      - aianimeshort
      - aianimation
      - aianimeedit
      - animeai
      - animestyleai
      - mangafilter
      - aimanga
      - ghibliart
      - ghibliai

  # NEW — AI historical POV (e.g. first-person ancient Rome / medieval scenes).
  - niche: historical_pov
    hashtags:
      - historicalpov
      - povhistory
      - aihistory
      - historicalai
      - romanempire
      - ancientrome
      - medievalpov

  # NEW — AI futuristic / sci-fi POV (spaceships, future cities, cyberpunk).
  # Hybrid, purity-leaning. The first guessed set (aispaceship/scifipov/...)
  # was mostly invented compounds and returned ~10 items in the probe. Research
  # (2026-05-31) showed broad #scifi is fandom-poisoned (startrek/starwars/
  # cosplay/warhammer — almost no AI), so it's excluded. Kept: AI-qualified
  # tags + the two broad tags whose clusters actually skew AI (#cyberpunk and
  # #futuristic both carry ai/aiart/midjourney per best-hashtags). Expected to
  # remain the smallest niche — TikTok simply has less AI sci-fi POV than the
  # surreal/liminal/historical families. That's fine; this niche is optionality.
  - niche: futuristic_pov
    hashtags:
      - aiscifi
      - aicyberpunk
      - aispace
      - futuristicai
      - aifuture
      - cyberpunkai
      - cyberpunk
      - futuristic

  # Reference niche (ablation + possible future account).
  - niche: brainrot
    hashtags:
      - italianbrainrot
      - brainrot
      - aibrainrot
      - brainrotai
      - surrealmemes
      - aimeme

  # Reference niche.
  - niche: horror_ai
    hashtags:
      - aihorror
      - horrortok
      - aihorrorstories
      - scarystoriesai
      - creepyai
      - analoghorror
      - foundfootage

  # Optionality — high-view AI ASMR / satisfying format.
  - niche: satisfying_ai
    hashtags:
      - aiasmr
      - satisfyingai
      - oddlysatisfyingai
      - glassasmr
      - aifood

  # ============================================================
  # EXPANSION PASS 2 (2026-06-07) — burn remaining ~$13 on NEW content.
  # Research-validated (firecrawl, 2026-06-07): AI ASMR is THE dominant AI
  # trend on TikTok; AI animals + viral AI "effect" trends (cakeify/squish/
  # melt/inflate/glass-fruit) + cinematic Veo3 micro-movies all confirmed hot.
  # De-overlapped against the 8 niches above AND against each other. Tags the
  # satisfying_ai niche already owns (aiasmr/glassasmr/aifood/satisfyingai/
  # oddlysatisfyingai) are NOT repeated here.
  # ============================================================

  # AI ASMR as its own deep niche — #1 cited AI trend (Veo3 synced-sound ASMR,
  # glass-fruit cutting). Surreal/satisfying-adjacent → strengthens core.
  - niche: ai_asmr
    hashtags:
      - glassfruit
      - glassfruitcutting
      - aiasmrvideo
      - veo3asmr
      - asmrai
      - aieatingsounds
      - asmrfoodeating
      - aicrunch

  # Viral AI "effect" trends — each is its own high-volume hashtag (objects
  # cakeified / squished / melted / inflated / turned to glass). Uncanny-
  # satisfying aesthetic, same family as surreal_hyperreal.
  - niche: ai_effects
    hashtags:
      - cakeify
      - squishy
      - aisquish
      - aimelting
      - aiinflate
      - inflateai
      - aitransformation
      - isitcakeai

  # AI animals — viral distinct content (fruit→animal hybrids, impossible
  # creatures, AI animal vlogs).
  - niche: ai_animals
    hashtags:
      - aianimals
      - aianimalvlog
      - animalfusion
      - aicreatures
      - aihybridanimals
      - fruitanimals
      - aizoo
      - aipets

  # Cinematic AI micro-movies — top-3 winning style; Veo3 cinematic shorts.
  # Premium-quality, surreal-adjacent.
  - niche: ai_cinematic
    hashtags:
      - aicinematic
      - aishortfilm
      - aimicromovie
      - veo3cinematic
      - aifilmmaking
      - cinematicai
      - aimovie
      - aitrailer
