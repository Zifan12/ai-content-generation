# Writer rubric — v0 (code-check tier only).
#
# A DEFECT DETECTOR for the P3 chained-continuity writer's TEXT plan
# (ContentPackage), scored BEFORE any paid render. NOT a quality certifier — P3.5
# real 7-day views own "good". Each criterion here is a deterministic ("code")
# check: a pure Python function over the schema, free + 100% reliable. Judgment-call
# criteria (vantage, anti-causal, device-fit) are the v1 LLM-judge tier and are NOT
# in this file.
#
# Each criterion's `id` MUST match a function name in src/evals/rubric_checks.py
# (the runner maps id -> function via a registry). Fields:
#   id          — stable criterion id == the check function name.
#   scope       — when the criterion applies:
#                   universal   : always.
#                   conditional : only when package.device is in applies_when.
#   applies_when — for conditional: the device value(s) that trigger it. May be a
#                  single device string OR a list of devices (the rule fires when
#                  package.device is one of them). Omitted for universal.
#   check_type  — "code" for all v0 criteria (judge criteria arrive in v1).
#   check       — one-line human description of the rule.
#   severity    — blocker (a real defect) | warn (heuristic, false positives OK).
#   source      — where the rule came from (doctrine / director corpus / finding).
criteria:
  - id: no_scale_comparison
    scope: universal
    check_type: code
    check: No keyframe/motion contains a literal size-comparison cliché.
    severity: blocker
    source: render finding (scale-ban leaks ~3x/run)

  - id: no_quality_incantations
    scope: universal
    check_type: code
    check: No text field carries dead "quality" words (8k, masterpiece, etc.).
    severity: blocker
    source: resources/image-video-director corpus (cargo-cult filler)

  - id: no_palette_in_keyframes
    scope: universal
    check_type: code
    check: No generated keyframe (start or end) carries palette/grade vocab or hex codes (mood_anchor owns the grade).
    severity: warn
    source: still-first schema doctrine (grade lives in mood_anchor)

  - id: no_style_words_in_motion
    scope: universal
    check_type: code
    check: motion is movement-only — no style/aesthetic adjectives.
    severity: warn
    source: still-first schema doctrine (motion = one movement)

  - id: device_requires_event_beat
    scope: conditional
    applies_when:
      - transformation
      - time_compression
    check_type: code
    check: At least one shot has an end_keyframe (a change-device must visibly advance).
    severity: blocker
    source: device doctrine (transformation / time_compression need an event beat)
