# Provider registry
# Change "active" to switch providers without code changes

video:
  active: null  # Set when you implement your first video provider
  providers: {}

tts:
  active: null
  providers: {}

llm:
  active: null
  providers: {}

image:
  active: null
  providers: {}

embedder:
  text:
    active: bge-m3
    options:
      bge-m3:
        model_name: BAAI/bge-m3
        dim: 1024
        device: auto                  # cuda if available, else cpu
        normalize: true
