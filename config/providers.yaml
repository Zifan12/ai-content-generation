# Provider registry
# Change "active" to switch providers without code changes

video:
  active: null  # Set when you implement your first video provider
  providers: {}

tts:
  active: null
  providers: {}

# Seat -> provider+model for every pipeline LLM call site (spec
# 2026-07-02-openrouter-mixed-fleet-design.md §3.2). Swapping a seat's model
# = edit here, no code change. Factory: src/providers/llm/factory.py.
#
# Promotion protocol (spec §3.4): a seat moves to a cheap model ONLY after
# negative-control + parity replay pass. Cheap candidate (Task 1 research,
# 2026-07-02): google/gemini-2.5-flash-lite ($0.10/M in, 20x cheaper than
# sonnet; backup google/gemini-2.5-flash). Until promotion, every seat runs
# sonnet via openrouter (same model as before, one wallet).
llm:
  event_extractor:  {provider: openrouter, model: "google/gemini-2.5-flash-lite"}
  context_agent:    {provider: openrouter, model: "anthropic/claude-sonnet-5"}
  idea_fit_gate:    {provider: openrouter, model: "google/gemini-2.5-flash"}
  gap_agent:        {provider: openrouter, model: "anthropic/claude-sonnet-5"}
  story_pitcher:    {provider: openrouter, model: "anthropic/claude-sonnet-5"}
  story_craft_gate: {provider: openrouter, model: "anthropic/claude-sonnet-5"}
  content_writer:   {provider: openrouter, model: "anthropic/claude-sonnet-5"}

image:
  active: null
  providers: {}

embedder:
  text:
    active: bge-m3
    options:
      bge-m3:
        model_name: BAAI/bge-m3
        dim: 1024
        device: auto                  # cuda if available, else cpu
        normalize: true

reranker:
  text:
    active: bge-reranker-v2-m3
    options:
      bge-reranker-v2-m3:
        model_name: BAAI/bge-reranker-v2-m3
        device: auto                  # cuda if available, else cpu
        batch_size: 8                 # pairs per forward pass; matches rag.reranker.batch_size in settings.yaml
