# Provider registry
# Change "active" to switch providers without code changes

video:
  active: null  # Set when you implement your first video provider
  providers: {}

tts:
  active: null
  providers: {}

# Seat -> provider+model for EVERY pipeline LLM call site — the single source
# of truth for which model a seat runs (spec 2026-07-02-openrouter-mixed-fleet
# -design.md §3.2, extended by 2026-07-03-openrouter-only-llm-wiring-refactor
# -design.md). Swapping a seat's model = edit here, no code change. Every
# class that uses an LLM requires an injected `llm` with NO hardcoded
# fallback — src/providers/llm/factory.py's llm_for_seat() is the only way a
# seat gets wired, so this file is authoritative. (config/settings.yaml does
# NOT carry a model for any seat — if you see one there, it's dead.)
#
# provider: openrouter routes every model below through one wallet. provider:
# anthropic (AnthropicLLM, native API) is supported but dormant — zero seats
# use it today; kept as a fallback option if OpenRouter's json_schema
# enforcement ever misbehaves for a seat (Anthropic's messages.parse enforces
# schema server-side; OpenRouter's is provider/model-dependent).
#
# Promotion protocol (spec §3.4): a seat moves to a cheaper model ONLY after
# negative-control + parity replay pass.
llm:
  event_extractor:     {provider: openrouter, model: "google/gemini-2.5-flash-lite"}
  context_agent:       {provider: openrouter, model: "google/gemini-2.5-flash"}
  idea_fit_gate:       {provider: openrouter, model: "google/gemini-2.5-flash"}
  gap_agent:           {provider: openrouter, model: "deepseek/deepseek-v4-pro"}
  story_pitcher:       {provider: openrouter, model: "deepseek/deepseek-v4-pro"}
  story_craft_gate:    {provider: openrouter, model: "deepseek/deepseek-v4-pro"}
  pitch_grounding:     {provider: openrouter, model: "deepseek/deepseek-v4-pro"}
  content_writer:      {provider: openrouter, model: "deepseek/deepseek-v4-pro"}
  blueprint_extractor: {provider: openrouter, model: "deepseek/deepseek-v4-pro"}
  taxonomy_bootstrap:  {provider: openrouter, model: "deepseek/deepseek-v4-pro"}
  eval_judge:          {provider: openrouter, model: "anthropic/claude-sonnet-5"}
  groundedness_judge:  {provider: openrouter, model: "google/gemini-2.5-flash"}
  location_anchor:     {provider: openrouter, model: "google/gemini-2.5-flash"}  # vision: room screencap -> world_anchor text (decision #4)

image:
  active: null
  providers: {}

embedder:
  text:
    active: bge-m3
    options:
      bge-m3:
        model_name: BAAI/bge-m3
        dim: 1024
        device: auto                  # cuda if available, else cpu
        normalize: true

reranker:
  text:
    active: bge-reranker-v2-m3
    options:
      bge-reranker-v2-m3:
        model_name: BAAI/bge-reranker-v2-m3
        device: auto                  # cuda if available, else cpu
        batch_size: 8                 # pairs per forward pass; matches rag.reranker.batch_size in settings.yaml
