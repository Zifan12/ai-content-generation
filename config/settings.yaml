# Scraping schedule
scraping:
  interval_hours: 6
  items_per_scrape: 50

# Recurring scrape settings (P1.6 RQ dispatcher)
scrape:
  recurring:
    schedule_cron: "0 */6 * * *"       # every 6h; consumed by external cron/rq-scheduler
    max_daily_extraction_spend: 1.00    # USD; mirrors DEFAULT_MAX_DAILY_SPEND in recurring.py
    per_niche_volume: 50                # max items per niche per run

# Content generation defaults
generation:
  default_duration_seconds: 30
  default_aspect_ratio: "9:16"
  content_style: "faceless"  # faceless, narrated, mixed

# RAG (retrieval-augmented generation) — P2
rag:
  embedder:
    active: bge-m3
    # batch_size tuned for RTX 4070 8GB + typical Windows desktop apps. 8 is safe with
    # browser/Discord/VS Code open; 16 may work with apps closed; 32 needs fp16 or empty
    # GPU. Increase when GPU is dedicated or fp16 mode is added.
    batch_size: 8
