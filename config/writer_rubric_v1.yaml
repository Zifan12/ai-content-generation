# config/writer_rubric_v1.yaml
# ---------------------------------------------------------------------------
# v1 LLM-judge rubric for the CHAINED-CONTINUITY writer (journey doctrine).
# 4 anchored dimensions, scored 1-5 by WriterJudge (Opus).
# Re-derived 2026-06-10 against the chain spec — the old vignette-era anchors
# (anti-causal) are inverted: development is now REQUIRED.
#
# ANCHOR RULES (unchanged):
#   * Outcome level, not instruction level.
#   * vividness = PROSE SPECIFICITY, not energy.
#   * device_execution carries the SELECTION CAP: wrong device for the premise
#     caps at 2 regardless of fluency (routing tree:
#     src/generation/content_writer.py <device> block).
# ---------------------------------------------------------------------------

dimensions:
  - id: premise_fidelity
    question: "Does the package realize the premise's actual subject and intent — recognizably the thing asked for — rather than drifting to an adjacent or generic subject?"
    anchors:
      1: "Renders a different or generic subject than the premise names — the specific thing asked for is absent, swapped for a stock version, or abandoned partway through the take."
      3: "The right subject is present but diluted — the premise's specific intent fades across the take, or the world drifts generic between the opening frame and the final segment."
      5: "The whole take is unmistakably the premise's subject and intent — the opening frame establishes the specific thing asked for and every segment stays inside that world."

  - id: development
    question: "Does the continuous take DEVELOP — each segment advancing one same experience toward somewhere — rather than holding a static state or splintering into disconnected scenes?"
    anchors:
      1: "Static or splintered — the three motions are interchangeable postcards (nothing advances; shuffling them changes nothing), OR a segment opens somewhere the previous motion could not have delivered it (a hidden cut / teleport breaking the chain)."
      3: "Advances but stutters — a real through-line exists, yet one segment stalls (marks time without advancing) or a seam jars (a motion ends in a state the next motion ignores)."
      5: "One unbroken developing moment — every motion advances the same experience, every seam hands off momentum (each motion ends where the next begins), and the final segment lands a deliberate ending; the take reads as one journey, not three clips."

  - id: device_execution
    question: "Did the package execute its chosen device well AND was that device the appropriate routing for this premise?"
    anchors:
      1: "Wrong device for the premise — e.g. a becoming-premise routed to embodiment instead of transformation, or a trap-default (embodiment / wrongness_creep) chosen with no rule-out; a wrong pick caps at 2 no matter how fluent. Also covers a fitting device botched (the device's signature never appears on screen)."
      3: "Appropriate device, sloppy execution — the device's signature is present but diluted (a transformation whose change mostly happens off-screen between segments; an encounter whose second presence barely registers; a reveal telegraphed in segment 1)."
      5: "Appropriate device AND disciplined execution — the device's signature carries the take (the change lands on screen via end_keyframes; the reveal recontextualizes late; the scale keeps dawning), and a trap-default pick earns itself with explicit rule-outs."

  - id: vividness
    question: "Does the keyframe and motion prose use specific, concrete sensory detail (subject, light, texture, body) — independent of how much action there is?"
    anchors:
      1: "Prose leans on abstract vibe-words that name a feeling but give the renderer nothing to draw — 'dramatic lighting', 'it gets scarier', 'epic chase'."
      3: "A mix — the opening frame is concrete (named light source, one tactile element) but the motions go generic ('moves forward', 'things change'), or vice versa; only part of the take is drawable from the words."
      5: "Concrete throughout — specific verbs, a named light source, tactile detail in the opening frame AND motions that name exactly what moves and how ('mandibles lock over the crystal', not 'a fight happens'); the whole take is drawable from words alone, even when calm."
