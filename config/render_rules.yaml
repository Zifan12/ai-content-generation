# ---------------------------------------------------------------------------
# GLOBAL CONSTRAINTS — append to a prompt unless the shot needs the excluded
# element. source: methodology/06-约束词清单. Phrase as positive/'do' for models
# without negative fields (most Higgsfield video models).
#
# ⚠️ STATUS (2026-07-13): NOT LIVE in the scene lane. rules.global_constraints()
# has had no caller since the still-first lane deletion (2026-07-07) — the
# adapter's scene tail hardcodes ONLY the no-text line + 'No music' + the model
# quality_suffix (adapter.py _scene_prompt). Kept for a future multi-model /
# still-first revival. BEFORE any re-wire: resolve 'locked camera, fixed
# position, no shake, no sudden zoom' below against motion_craft.camera_grammar
# (LIVE as of 2026-07-13) — co-emitting it with a deliberate camera move cancels
# both (see contradictions block). That rule was anti-drift craft for the
# STILL-FIRST i2v era, not a motion-native scene rule.
#
# Each bucket declares `kinds:` — which prompt type(s) it applies to — so the
# accessor returns the right SUBSET per prompt kind (still vs motion). This
# encodes the i2v rule (image-video-director/03 L110-116 + 05-misconceptions):
# the motion (i2v) prompt is motion/camera/timing/audio ONLY and must NOT
# restate the still's look, so `style_consistency` is `kinds: [still]` — it
# describes the grade the still already carries. Everything else is
# `kinds: [still, motion]`. A bucket with no `kinds:` is treated as both.
#
# `style_consistency` holds the `[STYLE]` placeholder — the builder substitutes
# the package mood_anchor for it at build time (only the still prompt does this,
# since style_consistency is still-only).
# ---------------------------------------------------------------------------
global_constraints:
  always_append:
    kinds: [still, motion]
    rules:
      - "no clipping, no stutter, no flicker"
      - "no watermark, no logo, no on-screen text or subtitles"
  # SPLIT OUT of always_append 2026-07-16, and scoped to still-only. "locked camera,
  # fixed position" directly contradicts the motion-native lane, where the director
  # writes a camera move into every scene_line ("Camera: slow push-in", "Camera:
  # tracks sideways matching the pull"). Sending both would be the same text-vs-text
  # contradiction that rendered two doors on pitch-51 (bugs.md BUG-030 forensics):
  # the model satisfies both instructions badly instead of picking one.
  #
  # This never shipped — global_constraints() was written and never called (wired
  # into the adapter 2026-07-16) — so retiring the clause from motion changes no
  # past render. It stays declared for `still` because a still genuinely has no
  # camera motion to permit; if the still lane ever wants a deliberate motion-blur
  # look, delete this bucket rather than widening it back to motion.
  camera_lock:
    kinds: [still]
    rules:
      - "locked camera, fixed position, no shake, no sudden zoom"
  stability:
    kinds: [still, motion]
    rules:
      - "facial features stable and undistorted"
      - "body proportions stable and undistorted"
      - "motion continuous and natural, not stiff"
  style_consistency:
    kinds: [still]   # i2v rule: motion prompt must NOT restate the look (still carries the grade)
    rules:
      - "hold [STYLE] throughout, no style drift, consistent color grade"
  subject_uniqueness:   # methodology/06 §防止双胞胎 L34-40 — ideally multi-subject only; left on for both in v1 (no clean multi_subject signal — see plan Task 6.7)
    kinds: [still, motion]
    rules:
      - "no duplicate or cloned figures, no twin/doppelganger effect"
      - "each person distinct in build, clothing and accessories"
  audio_cleanliness:    # methodology/06 §音频干净度 L51-55 — ideally audio-only; motion-only since stills are silent
    kinds: [motion]
    rules:
      - "audio natural with no truncation or clipping noise"
      - "audio fades out cleanly at the end, no abrupt cut"

# ----------------------------------------------------------------------Yeah-----
# CONTRADICTIONS — never co-emit; they cancel and waste the slot.
# source: methodology/06 矛盾约束清单.
# ---------------------------------------------------------------------------
contradictions:
  - [film_grain, ultra_sharp]          # grain IS blur+grain, fights 4K/ultra-sharp
  - [cinematic, documentary_handheld]  # styles pull against each other if both forced
  - [slow_motion, high_speed_action]
  - { rule: "max 2 named artist/style refs", reason: ">2 -> model picks one at random" }

# ---------------------------------------------------------------------------
# SPECIAL-CHAR ENCODING — typed delimiters for audio/dialogue/subtitle inside a
# prompt. source: methodology/07. LOW PRIORITY for surreal_hyperreal (wordless /
# English-first); relevant mainly to Chinese-dialogue models (Kling/即梦/Wan).
# Recorded so it's not lost; a builder only needs it once it writes dialogue.
# ---------------------------------------------------------------------------
special_chars:
  music: "( )"          # 背景音乐 — e.g. (slow jazz piano in the background)
  sfx: "< >"            # 音效 — e.g. <distant dog barking>
  dialogue: "{ }"      # 台词 — e.g. {long time no see}; tag foreign lang: 用英语说{...}
  subtitle: "【 】"     # 字幕 — e.g. 【Chapter 2: Reunion】
  language_rule: "Keep dialogue in ONE language (no CN/EN mix except proper nouns); tag foreign-language lines with the spoken language."
  homophone_fix: "For mispronounced rare/polyphonic Chinese characters, substitute a same-sound common character (鳞→吃, 萋→凄). Mitigation only, not a full fix."

# ---------------------------------------------------------------------------
# ESCALATION — when plain text can't force an effect (esp. impossible physics /
# specific end-states). source: methodology/08 避坑12问 #8 + 03/05 keyframing.
# Ordered cheapest -> strongest.
# ---------------------------------------------------------------------------
escalation:
  - lever: keyframe_start_end
    when: "text-only render won't pin a specific END state (e.g. impossible 'edges stay full' frozen moment)"
    how: "Generate an END still showing the target final state; feed start-image + end-image, prompt only the transition. Higgsfield: --start-image / --end-image. Best on veo3_1, seedance_2_0, kling3_0 (+ Pika Pikaframes, unavailable)."
    cost_note: "+1 still (~6cr) over plain i2v."
  - lever: reference_video
    when: "a specific effect/motion logic still won't render from text or keyframes"
    how: "Provide a reference clip of the target motion; tell the model what to COPY (motion/camera, not style). Seedance @-video, Kling Omni video_url."
  - lever: switch_model
    when: "the model's prior fundamentally fights the premise (e.g. Veo realism prior vs impossible physics)"
    how: "Re-route per `routing:` to a model whose strength matches (impossible physics -> minimax_hailuo)."

# ---------------------------------------------------------------------------
# POV GRAMMAR — camera-as-eyes first-person register for the generic-topic
# POV pipeline (slice ①). Spec: .scratch/pov-pipeline/PRD.md. Consumed by
# ticket 02's deterministic compiler (script in -> final prompt text out);
# nothing here is LLM-phrased — every skeleton clause is fixed text the
# compiler code injects verbatim (PRD user story 13).
#
# PROBE-VALIDATED 2026-07-17 (Tier-1 evidence: two paid Seedance 2.0 renders
# + USER WATCH CONFIRMED PASS on both, render_taste_test/pov_probe/
# PROBE_SHEET.md). This SUPERSEDES the prior CORPUS-ONLY status of
# first-person camera vocabulary (methodology/15 Format 3 was a documented-
# but-untested-on-our-stack claim before this probe; it is now measured).
#
# Every entry below carries its own `evidence:` field: a `probe:` artifact
# path (Tier-1, paid render + user watch), a corpus `file:line` citation
# (verified by direct Read, not grep-inferred), or the literal marker
# `candidate` (untested inference — ticket 02+ should not treat it as load-
# bearing the way it treats a probe- or corpus-backed entry).
#
# `[PROTAGONIST]` is a bracket-substitution placeholder, the same convention
# global_constraints uses for `[STYLE]` (see RenderRules.global_constraints
# in src/generation/render_adapters/rules.py) — the compiler fills in the
# script's protagonist noun (e.g. "explorer", "diver"). Substituting that one
# noun is the ONLY variation the skeleton clauses ever undergo; the wording
# around it is fixed, which is what "verbatim" means in the PRD.
#
# Manual cross-check (ticket 01 acceptance criterion; re-verified 2026-07-17
# after the slice-1 verifier FAILED the original claim — an earlier revision
# carried a fifth "hands_visible" fixed clause whose text appears in NEITHER
# probe; hands-visibility is expressed INLINE in each probe's Subject: detail,
# so it is a script-stage authoring rule (protagonist_detail_craft below),
# not a fixed clause. Direct comparison against
# render_taste_test/pov_probe/probe1_prompt.txt and probe2_prompt.txt):
#   skeleton_clauses.camera_as_eyes.calm -> opens BOTH probes verbatim
#                                            (.action = corpus sd-067 verbatim,
#                                            NOT yet probe-watched — see its
#                                            evidence field)
#   "Subject: an unseen [PROTAGONIST]"    -> unseen_protagonist fragment,
#                                            verbatim in both probes; the
#                                            script's own detail completes the
#                                            sentence and carries the
#                                            hands-visibility phrasing
#                                            (probe 1: "...with a headlamp, gloved
#                                            hands occasionally visible at the
#                                            bottom of frame."; probe 2: "...
#                                            kneeling..., bare hands visible in
#                                            frame.")
#   [[Action: / Scene: — script-specific, not fixed clauses]]
#   [[Light: — script-specific; content folded into World: prose per
#     world_prose_craft.light_time_source_emitter_tone, label dropped]]
#   [[Camera: mid-prompt line ("POV handheld with realistic micro-shake") —
#     DELIBERATELY NOT PORTED (root-cause gate 2026-07-17): both probes carry
#     it IN ADDITION to the opening shake sentence, but no watched defect has
#     been attributed to its absence across three watched renders; port on
#     recurrence per whack-a-mole policy, don't add speculatively]]
#   skeleton_clauses.anti_drift_constraint -> "No cuts, no zooms, natural head
#                                              movement only." appears verbatim,
#                                              mid-prompt, in BOTH probes
#   skeleton_clauses.style_register.calm  -> "Style: photoreal documentary
#                                              tension." VERBATIM in both probes
#                                              (slot was MISSED by the original
#                                              ticket-01 transcription — found
#                                              2026-07-17 via the styleless kaiju
#                                              watch, BUG-033; .action = corpus
#                                              sd-067 + lanshu-15 anti-plastic
#                                              negation, not yet probe-watched)
#   [[Audio: — script-specific]]
#   skeleton_clauses.constraints_block   -> closes BOTH probes verbatim
# ---------------------------------------------------------------------------
pov_grammar:
  skeleton_clauses:
    camera_as_eyes:
      note: "Register variants — the compiler selects by POVScript.camera_register (the script seat chooses by story energy). Added after the first live run (2026-07-17, output/pov/20260717_175253_*): a single calm-locked clause carried 'slight natural shake' into an action story; operator verdict 'complete fail, not interesting'. Proven ACTION prompts (sd-067) use hyper-chaotic camera language; every story inheriting the calm cave probe's camera flatlines the energy."
      calm:
        text: "Single continuous shot, first-person POV perspective, the camera IS the [PROTAGONIST]'s eyes. First-person handheld footage with slight natural shake."
        evidence: "probe:render_taste_test/pov_probe/PROBE_SHEET.md (probe 1 + probe 2, both opening line, USER WATCH CONFIRMED PASS 2026-07-17: 'Stays first-person the ENTIRE clip') + corpus lanshu methodology/15-seedance-masterclass.md:161 ('Seedance's advantage: almost the only model that stably holds first-person POV, hands visible + realistic reactions') + all-prompts.json:8176 (sd-067, 'the camera IS her eyes')"
      action:
        text: "Single continuous shot, first-person POV perspective, the camera IS the [PROTAGONIST]'s eyes. Hyper-chaotic handheld motion, completely unstabilized, violent raw human movement, constant micro-jitters, aggressive head swings, abrupt jerks, frequent over-rotation."
        evidence: "corpus all-prompts.json (sd-067 'Electro POV', source Higgsfield-published Seedance 2.0 prompt, higgsfield.ai/s/seedance-2-0-higgsfieldai-kQBLPo) — camera chain VERBATIM: 'hyper-chaotic handheld motion, completely unstabilized, violent raw human movement, constant micro-jitters, aggressive head swings, abrupt jerks, frequent over-rotation'; opening sentence shared with the calm variant (sd-067's own 'Single continuous shot, first-person POV perspective, the camera IS her eyes'). sd-067's 'wide-angle lens (strong distortion)' deliberately NOT carried (lens choice, not camera motion). CORPUS-ONLY as of 2026-07-17 — not yet validated by our own watched render; promote to probe: evidence after the first action-register 480p watch passes."
    unseen_protagonist:
      text: "Subject: an unseen [PROTAGONIST]"
      note: "No trailing comma — probe 1 reads 'an unseen explorer with a headlamp,' (no comma after the role noun); the script's own gear/pose detail follows with its own connective and completes the Subject: sentence. That trailing detail is script-specific content, not part of the fixed clause, and MUST carry the hands-visibility phrasing (protagonist_detail_craft.hands_visible below); only [PROTAGONIST] is a substitution token in this block."
