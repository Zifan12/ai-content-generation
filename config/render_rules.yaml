  protagonist_detail_craft:
    hands_visible:
      rule: "The script stage's protagonist_detail MUST express hands-visibility inline in the Subject: sentence, in story-specific wording (e.g. 'gloved hands occasionally visible at the bottom of frame' / 'bare hands visible in frame') — it is NOT a fixed clause the compiler injects. Enforced at the script-writer prompt level only; no lexical code check (a synonym like 'gauntleted fingers' is valid — lexical checks can't read prose, see memory project_spine_check_rejected_lexical)."
      evidence: "probe:render_taste_test/pov_probe/PROBE_SHEET.md (probe 1: 'gloved hands occasionally visible at the bottom of frame'; probe 2: 'bare hands visible in frame' — both INLINE in the Subject: sentence, neither probe carries a standalone hands sentence; USER WATCH CONFIRMED PASS, 'Hands correct — no extra hands, no warped fingers') + corpus lanshu methodology/15-seedance-masterclass.md:161 ('hands visible + realistic reactions'). History: slice-1 verifier (2026-07-17) FAILED an earlier revision that promoted this to a fixed skeleton clause with invented wording found in neither probe."
  kill_list:
    dead_intensifiers:
      words: ["stunning", "breathtaking", "ultra-detailed", "masterpiece", "best quality", "8K"]
      evidence: "corpus image-video-director/04-visual-vocabulary.md:94 ('Generic intensifiers: stunning, breathtaking, ultra-detailed, best quality, masterpiece') + 05-运镜词典 L9 — same list already promoted in motion_craft.anti_intensifiers (this file); duplicated here (not referenced) so the POV compiler scrubs LLM-authored script prose without a cross-block read"
    cinematic_without_specifics:
      word: "cinematic"
      rule: "The compiler scrubs 'cinematic' unconditionally (blanket, no paired-usage carve-out): the corpus carve-out ('cinematic film tone, 35mm, golden hour' is legitimate) exists, but no POV probe or corpus POV example uses the word, and a comma-proximity heuristic could false-negative on a paid render — safe simplification, revisit if a real script legitimately wants the paired form."
      evidence: "corpus image-video-director/04-visual-vocabulary.md:94 ('Cinematic alone without props, light sources, and placement is insufficient') + video_model_system_guide.md:175,300,675 (same finding stated three separate times in the Seedance-adjacent playbook: 'cinematic alone is too vague, the model guesses — pair with specifics')"
    glow_glimmer:
