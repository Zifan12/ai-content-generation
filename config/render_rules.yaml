      evidence: "candidate — flagged candidate-strength in .scratch/pov-pipeline/PRD.md Implementation Decisions; no direct corpus citation found for this specific substitution. Kept because both words read as a flicker/strobe cue and probe 2's script deliberately used a continuous, non-flickering 'glow brightens' rather than 'glimmer' to avoid an unwanted strobe rendering — a single probe data point, not a corpus rule, hence candidate not corpus-cited"
  beat_budget:
    at_10s:
      min: 4
      max: 6
      evidence: "interpolated — no worked 10s single-take POV corpus example was found; linearly scaled down from the 15s corpus-counted figure below (~7 beats * 10/15 ≈ 4.7), per PRD Implementation Decisions ('interpolated from corpus, labeled as such') — this range is NOT itself corpus-measured"
