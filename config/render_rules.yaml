      min: 5
      max: 8
      evidence: "corpus-counted from all-prompts.json:8176 (sd-067, 'Electro POV', params.duration '15s', single continuous shot) — ~7 countable physical beats in its 15s body (reach-catch-crush the sphere / energy surges through the arms / lunge and slam a radial surge / catch and redirect the beam / sprint at the titan / drive both hands into its core / core fractures into slow motion), falling inside 5-8"
  audio_rule:
    closing_term: "no music"
    rule: "The compiled Audio: sentence always ends with this term — diegetic in-scene sound only, never a score. The compiler reads it from here (one-source-of-truth rule, render_adapters/rules.py module docstring), never hardcodes it."
    evidence: "probe:render_taste_test/pov_probe/PROBE_SHEET.md (both probes' Audio: line ends 'no music'; USER WATCH CONFIRMED PASS) + seedance_2_0.dialect.audio_rule (this file) — same closing-term convention the scene lane already uses; PRD Implementation Decisions: no narrator, native in-scene audio"
  dialogue_rules:
    never_final_beat:
      rule: "A dialogue line never lands on the script's last beat."
      evidence: "corpus lanshu methodology/08-避坑12问.md:139-141 (pitfall #10, '视频结尾有噪音' / video-end-noise: 'when the video contains narration, the clip's tail end tends to produce abrupt clicking / truncation noise') — dialogue placed at the very end sits in this documented audio-artifact zone; the PRD's own flagged open tension on whether 15s generations degrade in their final seconds (.scratch/pov-pipeline/PRD.md Further Notes) makes end-placement doubly risky, hence the rule applies at both durations"
    length_fits_seconds:
      rule: "A dialogue line's spoken length must fit the beat's seconds — never more than can be said naturally in the beat's share of the clip."
      evidence: "corpus lanshu methodology/12-veo-公式.md:76-81 ('8-second rule': 'keep dialogue short — it should be something that can be said in just about 8 seconds, as trying to pack too much in can result in characters speaking way too fast') — cross-model craft rule, already reused on this exact basis by veo3_1.dialect.dialogue_length_rule in this file"
    plain_quoted_prose:
      rule: "Dialogue is written as plain quoted prose (e.g. the voice says, 'line here'), never the native-platform ()/<>/{} audio-type symbols."
      evidence: "measured — seedance_2_0.dialect.bracket_ban + prose_chain_grammar (this file; render_taste_test/seedance_motion_test/FINDINGS.md, 2026-07-06): the Higgsfield CLI is confirmed prose-only text, no special-character syntax exposed. The special_chars block (this file, source methodology/07) documents the native-platform ( ) < > { } 【 】 encoding but is explicitly flagged low-priority/unconfirmed on Higgsfield outside Chinese-dialogue models — plain prose is the only MEASURED-working form"
  world_prose_craft:
    light_time_source_emitter_tone:
      rule: "Name the light in up to four parts — time of day (when relevant), physical source, the named emitter object, and its tonal quality — e.g. 'hard headlamp beam as the only key light' names source + emitter + tone; 'soft side lighting during the golden hour' names time + direction + quality. Never 'dramatic lighting' alone."
      evidence: "corpus image-video-director/04-visual-vocabulary.md:20-24 (Motivated Practicals: 'naming the source object helps the model place the light logically in the scene'; Combined Direction/Quality/Temperature: 'soft side lighting during the golden hour carries direction, quality, and color temperature in a single phrase — the most efficient lighting prompting pattern') + probe:render_taste_test/pov_probe/PROBE_SHEET.md (both probes' Light: line names source + emitter + tone: 'hard headlamp beam as the only key light' / 'hard headlamp beam plus the rising blue glow of the shard')"
    depth_layered_nouns:
      rule: "Stage the world in foreground / midground / background with concrete named objects assigned to each layer, not a flat single-plane description."
      evidence: "corpus image-video-director/04-visual-vocabulary.md:98-99 ('foreground, mid-ground, background with concrete objects assigned to each layer — multi-model tests confirm correct placement even when models fail other criteria')"
    particulates:
      rule: "Give the air something physical to render — dust, damp haze, drifting motes, breath fog — rather than leaving the space visually empty."
      evidence: "corpus image-video-director/04-visual-vocabulary.md:78-79 (Particulate and Air as Renderable Objects: 'dust particles dancing in a single beam of light' ... 'these give the model physical material to render')"
    body_word_target:
      min_words: 60
      max_words: 100
      excludes: "the fixed skeleton_clauses and constraints_block text — the target applies only to the script-specific body (Subject/Action/Scene/Light/Style/Audio prose)"
      evidence: "corpus video_model_system_guide.md:138-148 ('Prompt length' table: 'Official Volcengine guide | 60-100 words' — Volcengine is Seedance's vendor cloud, i.e. this is the model's own official guidance)"

