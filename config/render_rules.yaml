# ---------------------------------------------------------------------------
# GLOBAL CONSTRAINTS — append to a prompt unless the shot needs the excluded
# element. source: methodology/06-约束词清单. Phrase as positive/'do' for models
# without negative fields (most Higgsfield video models).
#
# ⚠️ STATUS (2026-07-13): NOT LIVE in the scene lane. rules.global_constraints()
# has had no caller since the still-first lane deletion (2026-07-07) — the
# adapter's scene tail hardcodes ONLY the no-text line + 'No music' + the model
# quality_suffix (adapter.py _scene_prompt). Kept for a future multi-model /
# still-first revival. BEFORE any re-wire: resolve 'locked camera, fixed
# position, no shake, no sudden zoom' below against motion_craft.camera_grammar
# (LIVE as of 2026-07-13) — co-emitting it with a deliberate camera move cancels
# both (see contradictions block). That rule was anti-drift craft for the
# STILL-FIRST i2v era, not a motion-native scene rule.
#
# Each bucket declares `kinds:` — which prompt type(s) it applies to — so the
# accessor returns the right SUBSET per prompt kind (still vs motion). This
# encodes the i2v rule (image-video-director/03 L110-116 + 05-misconceptions):
# the motion (i2v) prompt is motion/camera/timing/audio ONLY and must NOT
# restate the still's look, so `style_consistency` is `kinds: [still]` — it
# describes the grade the still already carries. Everything else is
# `kinds: [still, motion]`. A bucket with no `kinds:` is treated as both.
#
# `style_consistency` holds the `[STYLE]` placeholder — the builder substitutes
# the package mood_anchor for it at build time (only the still prompt does this,
# since style_consistency is still-only).
# ---------------------------------------------------------------------------
global_constraints:
  always_append:
    kinds: [still, motion]
    rules:
      - "locked camera, fixed position, no shake, no sudden zoom"
      - "no clipping, no stutter, no flicker"
      - "no watermark, no logo, no on-screen text or subtitles"
  stability:
    kinds: [still, motion]
    rules:
      - "facial features stable and undistorted"
      - "body proportions stable and undistorted"
      - "motion continuous and natural, not stiff"
  style_consistency:
    kinds: [still]   # i2v rule: motion prompt must NOT restate the look (still carries the grade)
    rules:
      - "hold [STYLE] throughout, no style drift, consistent color grade"
  subject_uniqueness:   # methodology/06 §防止双胞胎 L34-40 — ideally multi-subject only; left on for both in v1 (no clean multi_subject signal — see plan Task 6.7)
    kinds: [still, motion]
    rules:
      - "no duplicate or cloned figures, no twin/doppelganger effect"
      - "each person distinct in build, clothing and accessories"
  audio_cleanliness:    # methodology/06 §音频干净度 L51-55 — ideally audio-only; motion-only since stills are silent
    kinds: [motion]
    rules:
      - "audio natural with no truncation or clipping noise"
      - "audio fades out cleanly at the end, no abrupt cut"

# ----------------------------------------------------------------------Yeah-----
# CONTRADICTIONS — never co-emit; they cancel and waste the slot.
# source: methodology/06 矛盾约束清单.
# ---------------------------------------------------------------------------
contradictions:
  - [film_grain, ultra_sharp]          # grain IS blur+grain, fights 4K/ultra-sharp
  - [cinematic, documentary_handheld]  # styles pull against each other if both forced
  - [slow_motion, high_speed_action]
  - { rule: "max 2 named artist/style refs", reason: ">2 -> model picks one at random" }

# ---------------------------------------------------------------------------
# SPECIAL-CHAR ENCODING — typed delimiters for audio/dialogue/subtitle inside a
# prompt. source: methodology/07. LOW PRIORITY for surreal_hyperreal (wordless /
# English-first); relevant mainly to Chinese-dialogue models (Kling/即梦/Wan).
# Recorded so it's not lost; a builder only needs it once it writes dialogue.
# ---------------------------------------------------------------------------
special_chars:
  music: "( )"          # 背景音乐 — e.g. (slow jazz piano in the background)
  sfx: "< >"            # 音效 — e.g. <distant dog barking>
  dialogue: "{ }"      # 台词 — e.g. {long time no see}; tag foreign lang: 用英语说{...}
  subtitle: "【 】"     # 字幕 — e.g. 【Chapter 2: Reunion】
  language_rule: "Keep dialogue in ONE language (no CN/EN mix except proper nouns); tag foreign-language lines with the spoken language."
  homophone_fix: "For mispronounced rare/polyphonic Chinese characters, substitute a same-sound common character (鳞→吃, 萋→凄). Mitigation only, not a full fix."

# ---------------------------------------------------------------------------
# ESCALATION — when plain text can't force an effect (esp. impossible physics /
# specific end-states). source: methodology/08 避坑12问 #8 + 03/05 keyframing.
# Ordered cheapest -> strongest.
# ---------------------------------------------------------------------------
escalation:
  - lever: keyframe_start_end
    when: "text-only render won't pin a specific END state (e.g. impossible 'edges stay full' frozen moment)"
    how: "Generate an END still showing the target final state; feed start-image + end-image, prompt only the transition. Higgsfield: --start-image / --end-image. Best on veo3_1, seedance_2_0, kling3_0 (+ Pika Pikaframes, unavailable)."
    cost_note: "+1 still (~6cr) over plain i2v."
  - lever: reference_video
    when: "a specific effect/motion logic still won't render from text or keyframes"
    how: "Provide a reference clip of the target motion; tell the model what to COPY (motion/camera, not style). Seedance @-video, Kling Omni video_url."
  - lever: switch_model
    when: "the model's prior fundamentally fights the premise (e.g. Veo realism prior vs impossible physics)"
    how: "Re-route per `routing:` to a model whose strength matches (impossible physics -> minimax_hailuo)."

