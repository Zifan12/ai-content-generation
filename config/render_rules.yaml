# render_rules.yaml
#
# Render-layer knowledge distilled from ai_video_resources/ guides and
# constrained to models the Higgsfield CLI actually exposes (verified via
# `higgsfield model list`, 2026-06-18). This is the machine-readable spec the
# RenderAdapter (src/, not yet built) consumes to: (1) ROUTE a shot to a model
# by motion/premise type, and (2) BUILD a model-native prompt from a writer
# shot-plan segment.
#
# Every block is tagged with its `source:` doc so rules are auditable, not
# invented. When a guide and a render disagree, the render wins — append an
# `evidence:` note rather than silently overriding the guide.
#
# Layering: this file is the SOURCE OF TRUTH for render routing/dialect.
# The methodology docs in ai_video_resources/ remain the cited reference;
# do NOT copy their prose here — transcribe only the executable rules.

meta:
  schema_version: 0
  verified_against_higgsfield: "2026-07-04"   # CLI 1.1.5 param sweep (was 2026-06-18 on CLI 0.2.3). NOTE: on 1.1.5 the i2v seed flag is --start-image (old --image is GONE on kling3_0/veo3_1; kling gained --end-image); nano_banana_2 references = repeated --image-references (alias --image), max 14.
  source_root: "ai_video_resources/"
  # Models present in the guides but NOT exposed by Higgsfield CLI — do not
  # route to these even though the guides praise them:
  unavailable_in_higgsfield: [pika_2_5, runway_gen4_aleph, sora_2, hunyuan_1_5, jimeng_3_0]

# ---------------------------------------------------------------------------
# MODELS — only Higgsfield-available video models. Ratings 1-5 sourced from
# methodology/13 + image-video-director/06. `cli_id` is the exact
# `higgsfield generate create <cli_id>` job-set type.
# ---------------------------------------------------------------------------
models:

  minimax_hailuo:
    cli_id: minimax_hailuo
    display: "Minimax Hailuo 02"
    source: "methodology/13 §3"   # NOT image-video-director/06 — that doc omits Hailuo (verified 2026-06-19, see INDEX L107)
    ratings: { physics: 5, audio: 1, consistency: 3, cinematic: 4, max_seconds: 10 }
    emits_audio: false   # i2v physics model, audio 1/5 — no usable native audio track
    best_for: [impossible_physics, fluid_motion, fire_smoke, cloth, gravity, real_motion]
    io_mode: pass_image_via_cli   # 2026-06-21 (own CLI test): ALWAYS pass --image to Hailuo via the Higgsfield CLI; text-only t2v FAILS here. Root cause NOT fully isolated (and moot for us — see below): (a) likely CLI bug — `--resolution` rejects its own listed values (512/768/1080), so with no image to set dimensions t2v falls back to an invalid 1024×1024 square and the render fails silently; (b) the base `minimax` variant ALSO hard-requires an image ("One of 'input_image' or 'input_image_end' must be provided"). i2v works because the 9:16 input image sets valid dims (output 768×1376). The official MODELS.md marks --image OPTIONAL, so the model itself may support t2v — UNCONFIRMED, do NOT claim the docs are wrong. MOOT for us: we are still-first, always have a seed image. PIPELINE/EXECUTOR IMPACT: the adapter only DECLARES jobs (no rendered still URL at build time); the executor must render the opening still FIRST, then inject it as --image into the Hailuo motion job at submit time.
    # evidence 2026-06-21 (OWN render, CLI i2v) — RESOLVES open_question #1: Hailuo HELD the impossible
    # "edges stay full" pool drain through to the final frame (10s) where Veo failed 3×. Seeded with a
    # brimming-full-pool nano_banana_2 still + motion prompt "drain at center, edges stay full". The center
    # hollowed into a deep vortex/funnel while the rim water stayed at the coping lip to the end — the
    # gravity-defying state HELD, photoreal stable, camera locked, no melt/mush. Confirms physics:5 and the
    # impossible_physics → minimax_hailuo route. Clip: render_taste_test/task8_hailuo_i2v/02_hailuo_drain.mp4.
    # Caveat: rendered as a whirlpool funnel (a valid reading of the prompt); the load-bearing impossible
    # constraint — rim full while center drains — is exactly what held.
    dialect:
      style: "Director's AI — wants a restrained SCRIPT, not piled-up visual adjectives."
      structure: "[1-2 subjects, clear] [clear temporal action] [terse scene] [emphasize ONE physical detail]"
      physics_keywords:   # methodology/13 §3 table — cash the impossible into physical verbs
        fluid: [water spray, fluid dynamics, surface tension]
        fire:  [flame flickers, smoke trails, combustion]
        cloth: [fabric folds, weight, silk ripples]
        gravity: [angular momentum, accurate gravity, knee absorption]
        material: [wood shavings, wax pooling, Maillard reaction]   # methodology/13 §3 L109
      anti_pattern: "Do NOT pile 'beautiful epic dramatic cool effects' — Hailuo drowns. Name the physical event instead."

  veo3_1:
    cli_id: veo3_1
    display: "Google Veo 3.1"
    source: "methodology/12 + 06 video selection"
    ratings: { physics: 3, audio: 5, consistency: 3, cinematic: 3, max_seconds: 8 }   # extendable to ~60 via chaining
    emits_audio: true   # native synced diegetic audio (audio 5/5) — the single-shot default
    best_for: [dialogue, multi_voice, precise_audio_sync, native_vertical, timestamped_pacing]
    variants: [veo3_1_lite]   # cheaper/faster Veo; route to it only after pulling real specs via `higgsfield model get`
    # NOTE: Veo physics is only 3/5 — do NOT default impossible-physics shots here.
    # evidence 2026-06-18: 3 word-only Veo renders of impossible "edges-stay-full" pool
    # drain all held edges mid-clip then drained by the END. Word phrasing (timestamps
    # AND shot-beats AND "holds level throughout") cannot pin an impossible END state on
    # Veo. -> impossible end-states require keyframe escalation OR a physics-stronger model.
    dialect:
      style: "Storyboard thinking. 100-150 words optimal. Frame -> action -> (dialogue) -> Audio."
      structure: "[Shot framing + motion]. [Subject]. [Action sequence]. [Style/light/mood]. Audio: [layered sound]."
      light_rule: "Name concrete sources ('overcast sky', 'neon sign') NOT 'dramatic lighting' — gives physical light logic, stabilizes shadows."
      audio_rule: "Veo improvises sound if omitted. Always include an Audio: line. Wordless product -> 'Audio: faint ambient room tone, near silence, no music.'"
      beats_vs_timestamps: "Prefer shot-numbered beats (Shot 1/2/3) over [00:00-00:03] timestamps. NOT because timecodes break Veo — Veo accepts them (a real param). methodology/03 (model-generic) cautions that FORCING precise per-segment duration is less reliable and prefers ordered beats. So shot-beats = safer craft default, not a hard ban. (Verified 2026-06-19: earlier 'corrupts output' wording overstated the source.) Separate, stronger finding: word-only prompts can't pin an impossible END state on Veo — see ratings note + escalation."
      dialogue_rule: "methodology/12 §L29-31: put dialogue on its own line with a 'Dialogue:' prefix (separate from the Audio: line), so Veo's native audio aligns it precisely."
      dialogue_length_rule: "methodology/12 §L76 (8-second rule): keep dialogue to one or two punchy lines — about what fits in ~8s. A full paragraph makes characters speak unnaturally fast."
      audio_specificity_rule: "methodology/12 §L101-106: name the exact sounds, not 'ambient sounds'. ✅ 'roaring V8 engines, sloshing water, gravel impacts' — ❌ 'Audio: ambient sounds'."
      character_first_rule: "methodology/12 §L96: describe WHO before what they do — lead with named/aged/clothed subject ('a mid-30s woman with short dark hair and a navy coat walks…'), not 'a woman speaks while walking'."
      cli_negatives: "No negative_prompt param on Higgsfield veo3_1 (verified). Fold exclusions into positive motion phrasing."
    notes:   # human-facing audit notes — NOT prompt material; builders read `dialect`, never `notes`
      cli_negatives_conflict: "RESOLVED 2026-07-04 (`higgsfield model get veo3_1`, CLI 1.1.5): Higgsfield exposes NO negative-prompt param on veo3_1 (params: aspect_ratio, duration 4/6/8, prompt, quality, start_image, variant). The guides' claim is about Veo's native API, which Higgsfield does not surface. KEEP positive-folding. Also new on 1.1.5: `variant` param (default veo-3-1-fast), i2v seed via --start-image."

  kling3_0:
    cli_id: kling3_0
    display: "Kling v3.0"
    source: "methodology/18 + 09 + 06"
    ratings: { physics: 4, audio: 4, consistency: 5, cinematic: 3, max_seconds: 15, max_shots: 6 }   # max_shots: doc 18 §5 + spike-confirmed 2026-07-04
    emits_audio: true   # native audio (audio 4/5)
    best_for: [multi_shot, character_consistency, shot_reverse_shot, transformation, chinese_dialogue]
    variants: [kling3_0_turbo, kling3_0_motion_control, kling2_6]
    # evidence 2026-07-04 (OWN renders ×2, render_taste_test/kling_multishot_spike/PLAN.md §8):
    # Higgsfield kling3_0 DOES cut internally in one generation — but ONLY in the native
    # grammar below. Seedance-style "SHOT N [Xs-Ys]:" labels rendered ONE continuous move
    # (attempt-1 failure, 30cr); native "Shot N (Xs-Ys):" + explicit angle-change verbs cut
    # frame-accurately at the requested boundaries (attempt 2, 20cr, cuts at 2.96s/5.96s).
    # Identity across internal cuts: user-judged only SLIGHTLY better than independent
    # grounded stills (PARTIAL-ACCEPT) — accepted launch mechanism, not a solved problem.
    dialect:
      style: "Coverage grammar + multi-shot structure (up to 6 shots / 15s). @-reference syntax. cfg_scale tunable."
      cfg_scale: "Higher = stricter prompt adherence; lower = more improvisation."
      consistency_rule: "Strongest cross-shot consistency. Reuse identity/anchor strings VERBATIM across shots."
      multi_shot_grammar: "LOAD-BEARING (spike 2026-07-04): 'Shot N (Xs-Ys): [angle] + [action] + [environment]. Audio: [...]' with explicit angle-change verbs ('Change angle to...', 'Switch to...'). Any other label format renders a continuous move instead of cuts."
      multi_shot_limits: "≤500 chars per shot; ≥3s per shot; ≤6 shots / 15s (4-5 recommended); prefer ~10s total over 15s for consistency; multi-shot is mutually exclusive with start+end-frame; ≤4 reference images."   # doc 18 §5 L181-194

  seedance_2_0:
    cli_id: seedance_2_0
    display: "Seedance 2.0"
    source: "methodology/15 + 19 + 06 + render_taste_test/seedance_motion_test/FINDINGS.md (2026-07-06 bisect, MEASURED)"
    ratings: { physics: 3, audio: 4, consistency: 4, cinematic: 4, max_seconds: 20, max_shots: 10 }   # NATIVE-platform claims (methodology/15 L83); Higgsfield-measured caps live in `limits:` below and WIN where they disagree
    emits_audio: true   # native audio (audio 4/5)
    best_for: [narrative_arc, multi_shot_story, transformation, multimodal_reference]
    variants: [seedance1_5]
    # ------------------------------------------------------------------
    # LIMITS — machine-read VALUES (spec D7: adapter/executor read these,
    # nothing model-numeric hardcoded in code; Seedance 2.5 = edit here).
    # ------------------------------------------------------------------
    limits:
      max_duration_seconds: 15      # MEASURED 2026-07-06 22:36 probe: 15s WORKS via CLI (15.07s output verified, 67.5cr). Earlier same-day bisect wrote "15s fails always" from confounded/transient early failures — corrected in FINDINGS.md. Vendor page also states 15s/shot.
      max_prompt_chars: 3200        # methodology/15 L364-366: Seedance ≤4000 chars, Higgsfield ≤3000-3500 — 3200 uses documented headroom (was 3000 floor); bumped 2026-07-14 after camera_grammar + Dan rules pushed mandatory scene-body content past the old floor (pitch-47 dry-run: 1900 chars vs 1708 budget)
      max_characters_in_scene: 3    # methodology/15 L136-139: >3 characters error-prone (misplacement/fusion); 2-3 main characters per shot recommended
      max_image_references: 9       # `higgsfield model get seedance_2_0` 2026-07-06 — counts start_image AND end_image
      max_reference_files_total: 12 # same source — images + videos + audios combined
      resolutions: [480p, 720p, 1080p, 4k]   # same source; mode 'fast' supports only 480p/720p
      cost_estimate_credits:        # executor dry-run pricing (ADR-0007): state cost per take before any paid run.
        # MEASURED 2026-07-06 from `higgsfield account transactions` (billing = ground
        # truth; the earlier ~35cr/10s session-note figure was wrong). Linear rates:
        per_second_480p: 3.0        # 45cr/15s — one measured point (billing 2026-07-16, the lift-split probe)
        per_second_720p: 4.5        # 22.5cr/5s, 45cr/10s, 67.5cr/15s — three measured points
        per_second_1080p: 9.0       # inferred from two FAILED (refunded) attempts: 90cr/10s, 135cr/15s — confirm on first kept 1080p render
    dialect:
      style: "Directorial thinking — the whole package is ONE generation, shots chained as prose. Subject first, one active verb per shot, camera after action, style anchor at the end, constraints last (five-part spine, methodology/19 §7)."
      prose_chain_grammar: "Open with shot 1's framing + action, then each subsequent shot as 'Then cut to [framing]: [subject action]. [camera]. Audio: [event].' The model cuts internally on the prose boundaries — MEASURED working on Higgsfield (FINDINGS.md); one camera move + one subject action per shot line (image-video-director/03 L9-16)."
      bracket_ban: "NEVER emit '[0-3s]'-style timestamp brackets or any per-shot second counts in prompt text — Higgsfield rejects bracketed timelines at any duration >5s (backend multi_shots/multi_prompt fields exist but are not CLI-exposed; MEASURED, FINDINGS.md). Duration is a CLI param only; seconds never appear in the prompt (spec D2). Overrides methodology/15 L81-88 and 19 §7 timeline syntax — those are native-platform dialects."
      ref_binding: "References bind POSITIONALLY: '...is Will (image1)' — the Nth uploaded image is (imageN) in upload order. Do NOT use '@Image1' syntax (native-platform dialect, unconfirmed on Higgsfield CLI). MEASURED working form, FINDINGS.md."
      camera_subject_separation: "Separate camera movement from subject movement in EVERY shot line: 'the dancer spins slowly, camera holds fixed framing' — never 'spinning camera around a dancing person'; ambiguous movement gets applied to everything at once (video_model_system_guide.md L150-158)."
      audio_rule: "Every shot line carries a CONCRETE audio event — name exact sounds ('ball on grass', 'crowd gasp'), never 'ambient sounds' (methodology/19 L102-111 per-clip structure; guide troubleshooting: keep native audio simple, critical audio in post). End the prompt with 'no music' — BGM/narration are added at assembly (spec D5); the native track keeps SFX only."
      quality_suffix: |
        4K, ultra HD, rich detail, sharp clarity, cinematic textures, stable picture.
        Maintaining face and clothing consistency without distortion or high detail.
        Generate the video without subtitles.
      # quality_suffix source: methodology/15 L54-60 verbatim ("加在每条 prompt"). NOTE: the
      # '4K' here is Seedance's own recommended tail and does NOT conflict with
      # still_dialect's drop-4K rule (that rule is the photoreal-STILL anti-AI-look
      # craft) or motion_craft's anti_intensifiers ('8K' bare-intensifier ban).
      sensitive_words:   # methodology/19 §3 replacement table + FINDINGS.md (first bisect failure carried young/fight/strike — filter risk, not fully isolated but treat as real)
        replace:
          "fight / battle / destroy": "intense power confrontation"
          "kill / brutal / attack": "dramatic energy clash"
          "punch / slash": "powerful forces meeting"
          "blood": "epic visual impact"
          "boy / girl / child / kid / young": "role/occupation description instead (e.g. 'rider on a gray horse')"
        action_wrapping: "Bare violence gets filter-killed; wrap the act in cinematic-narrative context (purpose / cultural setting / role duty) — e.g. 'fires a shot skyward' -> 'the rider raises an old rifle and fires a single signal shot into the gray sky' (methodology/19 §3)."

  wan2_7:
    cli_id: wan2_7
    display: "Wan 2.7"
    source: "methodology/13 §5"   # NOT image-video-director/06 — that doc omits Wan (verified 2026-06-19, see INDEX L107)
    ratings: { physics: 3, audio: 5, consistency: 3, cinematic: 3, max_seconds: 15 }
    emits_audio: true   # voice auto-lip-sync + sfx + bgm (audio 5/5)
    best_for: [digital_human, lip_sync, talking_head, broadcast]
    variants: [wan2_6]
    dialect:
      style: "Entity + Scene + Motion + Sound. Sound: layer is its soul (voice auto-lip-syncs + sfx + bgm simultaneously)."

  grok_video_v15:
    cli_id: grok_video_v15
    display: "Grok Video 1.5"
    source: "06 video selection (Grok Imagine)"
    ratings: { physics: 3, audio: 3, consistency: 3, cinematic: 2, max_seconds: 15 }
    emits_audio: true   # synchronized audio (audio 3/5)
    best_for: [fast_cheap_social, scale]
    dialect:
      style: "Declarative prompts, synchronized audio. 720p cap — cheap/fast, lower fidelity."

# ---------------------------------------------------------------------------
# SCENE LANE — the CURRENT (motion-native) render path, locked 2026-07-06
# (docs/superpowers/specs/2026-07-06-motion-native-render-refactor.md).
# ONE prose-chained generation renders the whole package; no per-shot routing,
# no breakouts, no Kling fallback (spec D3). The adapter composes the scene
# prompt from models.<scene_lane.model>.dialect; the executor reads defaults
# and limits from here. Seedance 2.5 readiness (D7): swap `model:` below +
# add a models block — zero code edits.
# ---------------------------------------------------------------------------
scene_lane:
  mode: single_gen             # single_gen (default, D3) | per_scene_splice (Way 2, 2026-07-14 grill Q1) — config-selectable second lane, NOT a replacement; single_gen stays the default/fallback
  # The channel's photographic register — FIXED, every render, never LLM-written
  # (2026-07-14 reference-ownership spec). Corpus: 18-kling-masterclass.md:92-107
  # "Style Bible Line" — one fixed sentence for 整个项目 (the whole project),
  # copy-pasted into every shot; its worked example is exactly this shape
  # ("Shot on ARRI Alexa, 2.39:1 anamorphic, filmic grain, warm desaturated
  # tones, practical lighting only, cinematic depth of field").
  # Carries: lens, stock, grain, grade, lighting PHILOSOPHY.
  # Never: a specific practical light, or this scene's mood — the location ref
  # owns the room and the scene line owns which lamp is on (spec ownership table).
  # Was LLM-written per pitch until 2026-07-14: two runs ten minutes apart on the
  # same show gave "anamorphic / cool blue tones" vs "35mm / amber color grade",
  # so the account's look changed at random per post.
  style_anchor: "Photoreal live-action, shot on 35mm with a fast prime, shallow depth of field, fine natural film grain, practical lighting only, neutral filmic grade."
  model: seedance_2_0          # D7 swap point — the ONLY place the lane's model is named
  defaults:
    duration_seconds: 15       # ratified 2026-07-10: 5-cut pitches need ~3s/cut (convergent pacing floor, FINDINGS.md 3-shot/10s=3.3s/cut not-slideshow); 10s crushes 5 cuts to 2s/cut. 15s measured working (67.5cr vs 45cr at 720p). Seedance CLI max=15 (limits block). NOTE: this is the EXECUTOR's CLI --duration; the writer's per-shot duration_seconds (PLAN prompt "total 10-15") is an INTERNAL pacing/narration budget that never reaches the CLI (D2) — the two are related but not the same number.
    resolution: 720p           # dev default — see retake_ladder
    aspect_ratio: "9:16"
    genre: auto                # 1080p + genre 'drama' untested in isolation (FINDINGS.md) — leave auto until a clean retest
    takes: 1
  splice_defaults:             # per_scene_splice lane ONLY (mode above); single_gen never reads this block
    duration_seconds: 7        # TUNABLE, NOT Higgsfield-measured (grill Q2). Corpus suggests 6-8s/clip (video_model_system_guide.md L420, L516-520) — that is Seedance-NATIVE guidance, never measured on our CLI. The first splice render is what actually tests it; treat a bad result as "retune this number", not "the lane failed".
  retake_ladder: "480p sanity-pass for a brand-new prompt (cheapest possible failure) -> 720p default dev take -> 1080p finals x2-3 takes, user picks best. Source: methodology/15 L288-298 ('480p 测 prompt -> 720p 看质量 -> 1080p 出成品') + spec D6."
  reroll_vs_reword: "Opaque failure (job rejected with no diagnosable cause, or output random-bad) -> re-roll the SAME prompt: failures are uncharged on Higgsfield (FINDINGS.md) and may be sampling noise or a transient filter trip (methodology/19 L282-285). Diagnosable defect (a specific element visibly wrong) -> reword THAT element; don't re-roll and hope (methodology/15 iterative-fix). A failed render is a loud stop for a human call, never an automatic retry (spec D3)."

# ---------------------------------------------------------------------------
# ROUTING — RETIRED as live routing (Task 10, 2026-07-07: router.py and the
# still-first lane are deleted; nothing routes on these lists anymore).
# KEPT because: (1) the keys are the MotionTag vocabulary (schema enum parity
# is test-enforced — the writer still labels shots for P4 features), and
# (2) the ranked lists + comments preserve paid render evidence (Veo vs Kling
# fluids 2026-06-17, Hailuo impossible-physics 2026-06-21) that any future
# multi-model revival would otherwise re-buy.
# source: methodology/13 + 10 decision trees, image-video-director/06.
# ---------------------------------------------------------------------------
routing:
  # BUG-011 (2026-07-05): minimax_hailuo TEMPORARILY pulled from routing — the executor's
  # uniform argv is incompatible with its CLI contract (duration must be 6|10, NO
  # --aspect_ratio param; wants resolution 512|768|1080 + variant instead; see
  # `hf model get minimax_hailuo`). Live cost preflight failed exit 4 on a 4s shot.
  # Restore hailuo to FIRST position in both keys below once the executor maps
  # per-model params — its impossible-physics render evidence (model block above) stands.
  impossible_physics: [seedance_2_0, veo3_1]   # hailuo pulled (BUG-011); NOT veo-first: Veo physics 3/5, fails impossible end-states (2026-06-18 evidence)
  fluid_motion:       [veo3_1, seedance_2_0]   # hailuo pulled (BUG-011); water/fire/smoke — Hailuo is physics king, restore when params mapped
  spectacle:          [seedance_2_0, kling3_0]                 # per-beat narrative/epic spectacle — MODEL_ROUTING.md spectacle row + 2026-07-04 redesign spec D5 (multi_shot_story is a whole-video concept; this is the beat-level tag)
  transformation:     [seedance_2_0, kling3_0]                 # melt/morph/grow — Pika unavailable, Seedance/Kling next
  multi_shot_story:   [seedance_2_0, kling3_0]
  character_consistency: [kling3_0, seedance_2_0]              # Kling strongest cross-shot
  dialogue:           [veo3_1, wan2_7, kling3_0]
  lip_sync_talking_head: [wan2_7, veo3_1]
  fast_cheap:         [grok_video_v15, veo3_1]   # grok = cheapest 720p; veo3_1 as quality fallback (veo3_1_lite is a veo3_1 variant, not yet spec'd)
  default:            [veo3_1, kling3_0]

# ---------------------------------------------------------------------------
# IMAGE-TO-VIDEO rule — applies to ALL models when starting from a still.
# source: image-video-director/05-misconceptions + 03-video-prompting §I2V,
# methodology/13 §4 (Hunyuan/Kling i2v iron law).
# ---------------------------------------------------------------------------
i2v_rule:
  principle: "The input image IS the visual prompt. Do NOT re-describe its contents."
  prompt_focus_only: [camera_movement_and_framing, subject_motion_and_action, timing_and_pacing, audio_events]
  why: "Restating image contents (palette, scene, style already in the still) REDUCES motion quality and causes unexpected results."

# ---------------------------------------------------------------------------
# STILL DIALECT — governs the OPENING still (the i2v seed frame), NOT the video
# models above. The still is an IMAGE-model prompt and obeys image-model rules.
# source: image-video-director/02-image-prompting + 04-visual-vocabulary.
# Highest-value block for surreal_hyperreal: the photoreal opening still is the
# scroll-stop hook, and the anti-AI-look 'authentic imperfection' rule is what
# keeps it from reading as obviously generated.
# ---------------------------------------------------------------------------
still_dialect:
  directive_stack_order: "Subject + identity FIRST, then hard constraints (framing, spatial layout), then the aesthetic/look layer. Earlier elements get more weight."   # 02 §directive-stack L6
  spatial_map: "Write composition as a literal spatial map (foreground/midground/background, left/right, centered, negative space) — forces layout instead of letting the model invent one."   # 02 L8
  camera_kit: "Add a compact camera-kit capsule (lens, aperture, light direction, texture cues), e.g. '50mm lens, f/1.8, soft overcast daylight'; reuse it verbatim across a series to lock style."   # 02 §camera-kit L12
  authentic_imperfection: "Anti-AI-look (load-bearing for surreal_hyperreal): request slight underexposure, natural grain, visible pores, fabric wear, environmental dust, uneven practical light. DROP 'perfect / flawless / ultra-detailed / 4K / masterpiece' — those pull toward the uncanny stock-photo look."   # 02 L76 + 04 L90
  light_naming: "Name the physical light source ('overcast sky', 'neon sign', 'window side-light at golden hour'), not 'dramatic lighting' — gives the model physical light logic."   # 04 L20
  composition_traps: "Do NOT write the phrase 'rule of thirds' (renders literal grid lines) — place elements directly ('subject on right third'). Avoid 'cut off' (risks literal interpretation)."   # 04 L104,102

# ---------------------------------------------------------------------------
# MOTION CRAFT — universal rules for the i2v MOTION prompt (all video models),
# on top of each model's dialect block. source: image-video-director/03.
# ---------------------------------------------------------------------------
motion_craft:
  # SIBLINGS — this rule is stated in FOUR places and has already drifted once (see
  # below). Change one, change all four; they cannot share a source because each
  # addresses a different reader:
  #   1. here — injected as DATA into the director's prompt (render_rules motion_craft)
  #   2. src/generation/content_writer.py DIRECTOR_SYSTEM_PROMPT — the director's own rules
  #   3. src/monitor/story_pitcher.py _STORYPITCH_FIELD_SPEC — tells the PITCHER how to write required_action
  #   4. src/monitor/schemas.py StoryBeat.required_action docstring — the durable contract
  # (1) and (2) are concatenated into ONE effective prompt, so a disagreement there is
  # a live self-contradiction — that pair is pinned by
  # test_injected_motion_craft_does_not_contradict_the_continuous_move_rule. (3) and (4)
  # reach a different stage and can only drift semantically; verified in sync 2026-07-15.
  #
  # Re-scoped 2026-07-15 (PRD D4) — the SUBJECT half only; the camera half is unchanged.
  # The old text ended at the bare phrase "ONE subject action per shot", which is where
  # this rule broke: an LLM reads a bare "one action" as ONE VERB, and on pitch 47 the
  # writer duly collapsed "lifts him onto the bed and cradles him" down to "cradles" —
  # killing the lift, so the next shot opened on an end-state with no cause.
  # THE CORPUS NEVER MEANT ONE VERB, and the source this rule already cites proves it:
  # 03:14 says "a single subject action", and its OWN example at 03:16 is "Actor takes
  # four steps to the window, pauses, and pulls the curtain in the final second" — three
  # sub-motions AND a destination, called ONE action. The compression to a bare phrase
  # dropped the example that defined the rule. Restored here, in the corpus's own words.
  # This is a SECOND, independent corpus source for D4 (Dan Kieft:471 "one flowing
  # motion per shot" is the other) — and unlike that one, 03 is not the doc INDEX.md
  # flags "cherry-pick, never adopt wholesale". D4 is better-founded than the PRD's
  # "[inference] plausibly, not measured" caveat assumed.
  one_move_one_action: "ONE camera move + ONE CONTINUOUS subject move per shot. Stacking camera moves ('dolly + pan + zoom + crane') produces floaty, game-like camera. ONE subject move means one FLOWING motion, however many sub-motions it takes — 'four steps to the window, pause, pull the curtain in the final second' is ONE action, not three. NEVER reduce such a chain to its final verb: the dropped sub-motions are the visible CAUSE of the shot's end-state, and without them the shot reads as broken. Unrelated actions with no single arc through them (waves, then sits, then pours a drink) still belong in separate shots."   # 03 §camera L9 (camera half) + 03 L14,16 (subject half + its beats example)
  action_as_beats: "Express the action as countable beats ('four steps to the window, pause, pull the curtain in the final second'), not vague verbs ('walks across the room') — vague action makes the model guess pace and drift."   # 03 L14-16
  emotion_is_visible: "Carry mood through lighting/palette/micro-performance (eye-line, breath, posture, tight jaw), NOT the words 'sad'/'epic'. Every emotional word must pair with something the camera can see."   # 03 §color-script L91
  anti_intensifiers: ["stunning", "breathtaking", "ultra-detailed", "masterpiece", "best quality", "8K"]   # 04 L94 + 05 L9 — wasted words across all modern models
  no_backandforth_actions: "Seedance honors only the FIRST move of a back-and-forth (look back -> front -> back again drops the return). Write one sustained move held long instead ('turns her head back, holds the look several seconds, then snaps front')."   # Dan-Kieft L432; PROMOTED from sequence_craft_candidates 2026-07-13; also enforced in SCENE_LINE_SYSTEM_PROMPT action rules
  # camera_grammar: emotion -> camera-move decision table. PROMOTED same-day
  # 2026-07-13 from camera_grammar_candidates (user call: corpus-first — implement
  # library levers before the next paid render; the photoreal pivot matches the
  # source examples' register, dissolving the anime-transfer caveat). Source: Dan
  # Kieft camera-movements video + aicameramovements.com 46-card bank, examples
  # generated on Higgsfield Seedance+Kling; full verbatim cards + per-move
  # verdicts: ai_video_resources/Dan Kieft Camera Movements.md. Spec:
  # docs/superpowers/specs/2026-07-13-camera-grammar-harvest-design.md.
  # VALIDATION PENDING: judged by eyeball on the next full multi-shot render —
  # do deliberate moves render, does the clip feel directed. Demote rows that fail.
  # Fragments deliberately <=10 words: scene lines budget 55-65 words TOTAL.
  camera_grammar:
    selection_rule: "Choose each shot's camera move by the beat's EMOTION via the rows below — a move is an emotional statement, not decoration. Menu is GUIDANCE, not a whitelist: a pitch that genuinely needs an unlisted move may use it (full 46-move vocabulary in the corpus doc). One move per shot, speed always qualified — one_move_one_action still governs."
    zoom_vs_dolly: "Zoom changes the LENS (camera stands still) = detached observation; dolly physically MOVES the camera = participation. Dolly-out reads as LEAVING the character behind (intimate abandonment); zoom-out reads as DISASSOCIATING (clinical, world grows). Pick by what the beat means. (05-运镜词典 conflates the two in one row — this is the correction.)"
    tension_dread: "Slow push-in toward the face or object ('Camera: slow push-in toward her face') — or a deliberately locked static frame; stillness IS a choice for dread and deadpan, one beat max, never the whole scene."   # cards: slow zoom in / dolly in / static; video 2:41-2:55, 4:39-4:46
    suspense_approach: "Follow close behind the subject's shoulder into the unknown ('Camera: follows behind his shoulder, matching pace')."   # card: follow/OTS; video 7:52-8:09 basement-stairs
    comedic_snap: "Crash zoom in WITH landing phrase ('Camera: crash zoom in, lands sharp on his face') for shock/realization/punchline; whip pan WITH landing phrase ('Camera: whip pan to the door, lands sharp') for a snap redirect between two subjects [EXPERIMENTAL — smear risk; landing phrase is the anti-smear lever]."   # cards: crash zoom in / whip pan; video 3:42-3:59
    comedic_absurd_reveal: "Crash zoom out, lands wide on the absurd whole scene ('Camera: crash zoom out, lands wide')."   # card: crash zoom out; video 3:59-4:16 casual-Friday gag
    defeat_isolation: "Slow dolly out, subject left small in frame ('Camera: slow dolly out, she stays small in the empty room') — or slow zoom out when the beat means disassociation, not abandonment (zoom_vs_dolly)."   # cards: dolly out / slow zoom out; video 4:46-5:01
    intimacy_tenderness: "Static close-up with shallow depth, or slow tilt between two emotional anchors ('Camera: slow tilt from their joined hands up to her face')."   # cards: static / tilt; matches existing SCENE_LINE example
    panic_chaos: "Handheld with subtle sway ('Camera: handheld, subtle sway') for raw discomfort; snorricam for full hysteria ('Camera: locked to his torso, background whirling around him') [EXPERIMENTAL — unvalidated in our pipeline; NEVER co-emit with a background-lock clause in the same shot line]."   # cards: handheld / snorricam; video 9:32-10:52
    attention_redirect_calm: "Slow pan from A to B ('Camera: slow pan from the desk to the doorway') — scan or reveal without alarm."   # card: pan; video 1:36-1:54
    kinetic_action: "Side-track parallel to the motion ('Camera: tracks sideways matching his sprint'); reverse-track when the FACE carries the beat ('Camera: moves backward in front of her, face locked centered')."   # cards: side tracking / reverse tracking; video 8:17-8:43
    scale_power_shift: "Tilt up or down between power positions ('Camera: slow tilt up from boots to face') — looking up reads small/weak, height reads power."   # card: tilt; video 1:54-2:08
    threshold_cross: "Pass-through or push-past the ONE Scene-Space threshold ('Camera: pushes past the doorframe into the hallway') — the camera language for sequence_craft.one_scene_space's single crossing."   # cards: pass-through / push past; site-only move

# ---------------------------------------------------------------------------
# SEQUENCE CRAFT — cross-shot rules for the ONE multi-shot scene generation
# (locked 2026-07-12, sequence-craft plan; grilled decisions Q1-Q3). Sources:
# every worked multi-shot example in the corpus stays in one space
# (03-分镜时序 L46-58, 02-进阶公式 L105-117, 15-masterclass L28-52,
# 18-kling L1001-1009/1120-1130); scene consistency harder than face
# consistency (19-round3 L164-169); pacing (video_model_system_guide
# L480-503, image-video-director/03 L13-21). Enforced upstream: pitcher spec
# (story_pitcher.py) + craft-gate dims 9/10 (story_craft_gate.py) + ShotDraft
# duration floor (src/schemas/generation.py). This block is the evidence
# record + single place a future stage reads the numbers from.
# ---------------------------------------------------------------------------
sequence_craft:
  one_scene_space: "ENTIRE story in ONE continuous space + at most ONE adjacent visible threshold (doorway/window/hallway-in-sightline), crossed at most once as part of the action. Multi-location turns need splicing, which the single-generation lane does not do."   # CONTEXT.md 'Scene Space'
  min_seconds_per_shot: 3        # 2s shot cannot fit a readable action (pitch-43 measured failure); Seedance examples run 3-5s/shot
  end_start_chain: "Each shot's action BEGINS where the previous shot's action ENDED (end-state = start-state)."   # 18-kling L191-194, model-generic craft
  payoff_gets_most_air: "The payoff/hero beat gets the longest duration of any shot; framing tightens across the arc (wide early, closest at the payoff)."   # guide L480-493 proportions (bracket syntax NOT transferable)

# ---------------------------------------------------------------------------
# CANDIDATE rules from the anime-tutorial-lane experiment (2026-07-13, pitch 47
# only — validated on ONE pitch; promote into sequence_craft/motion_craft after
# a fresh-pitch run confirms they generalize). Evidence: gitignored
# docs/superpowers/plans/2026-07-12-anime-tutorial-lane.md VERDICT section +
# three video-researcher corpus sweeps (2026-07-13 session), citations inline.
# NOT wired into any stage yet — documentation of harvested rules only.
# ---------------------------------------------------------------------------
sequence_craft_candidates:
  action_as_counted_beats: "Write actions as countable beats ('claws forward three times', 'four steady steps'), never bare verbs ('drags', 'walks') — vague verbs under-specify motion and render near-static."   # image-video-director/03 L13-16
  explicit_orientation_per_shot: "State facing/direction for every subject and the camera ('he faces the door and crawls toward it') — spatial staging is prompt-only; no storyboard-lock mechanism exists."   # 03-分镜时序 L25-30
  location_geography_line: "Every location carries a written floor plan (window wall / bed side / door wall) repeated verbatim per shot — a screencap alone does not pin left/right; the model invents a floor plan per generation."   # measured: pitch-47 clip A bed-left; extends refs/_location world_anchor convention
  limb_accounting_contact_shots: "Two-character contact shots enumerate every hand/arm and its position ('her right arm across his chest... both his hands in his lap') — the amalgamation glitch invents extra limbs otherwise. Contact shots remain a re-roll lottery; budget 2-4 takes."   # guide L442 amalgamation + L444 hand-anchoring; measured pitch-47 clip C 3-arm frame
  facial_beats_sync_anchored: "Expressive dialogue shots script the face as ordered micro-beats and bind the turn to a word ('as she says X, her smirk deepens'); add 'maintain sharp facial features'. Expression never as adjectives."   # 04-情绪外化表 L3-18, image-video-director/03 L67-70 sync anchors, guide L443 face-softening
  per_scene_clip_splice: "CANDIDATE ARCHITECTURE (not locked — conflicts with motion-native D3 single-lane; supersession decision pending fresh-pitch validation): 6-8s per generation, one clip per scene, hard-cut splice in post. Quality degrades past 6-8s inside long generations; 5 shots/15s single-gen produced mid-generation garbage at 6-9s. Frame-trim fix at jumpy seams: 6 frames off earlier clip's tail, 1 off later clip's head."   # guide L420+L516-527, 19 L113-116, 08 L63-76; measured pitch-47 take_1
  measured_soul_id_facts: "Soul UUIDs REJECTED as seedance_2_0 image-references (job fails, uncharged). Training 25cr flat, 5-20 images, every image needs a detectable face (back view -> face_not_found, refunded). Souls usable only via --soul-id on Soul image models (text2image_soul_v2, soul_cinematic); trained souls live in refs/<slug>/soul_id.txt."   # measured 2026-07-13, billing-verified
  voice_persistence: "Native dialogue voice is re-invented per generation (no cross-render lock). Persistence path: ~15s voice sample as --audio-references + 'use the vocal qualities of audio1'; keep the sample per character in refs/<slug>/. Extension (upload prior clip) claims voice carry-forward; cross-independent-clip voice consistency is an undocumented gap."   # 19 L54, 15 L346-350, 08 Q12
  # --- Harvested 2026-07-13 from ai_video_resources/Dan Kieft Cinematic Seedance
  # Updated.md (OpenArt dialect — @image tags, native Seedance UI). Higgsfield CLI
  # transfer UNVERIFIED for each unless noted; Higgsfield binds refs positionally
  # ('image1'), not @-tags (FINDINGS.md). Treat as candidates pending our own render.
  # header_24fps PROMOTED 2026-07-13 -> adapter.py _scene_prompt preamble ("24fps. " opens every composed scene prompt).
  # no_backandforth_actions PROMOTED 2026-07-13 -> motion_craft (writer call 1) + SCENE_LINE_SYSTEM_PROMPT action rules (call 2).
  # background_lock_clause PROMOTED 2026-07-13 -> SCENE_LINE_SYSTEM_PROMPT SPACE rules (conditional per shot: locked when the story doesn't change the space, skipped on threshold-cross shots).
  chinese_prompt_body: "REJECTED 2026-07-15, stage deleted — do NOT re-adopt on a re-read of Dan-Kieft L43 (OpenArt dialect, unjustified). Rationale: .scratch/director-stage/issues/01-delete-chinese-translator.md. Re-adopt only behind a real Higgsfield A/B."
  ref_tag_by_shot_size: "Select refs per shot size: face ref tagged EVERY shot the character appears; body/turnaround sheet only on wide/full/medium (drop on close-ups — small odd-angle faces on a sheet confuse the model); detail/texture sheet on close-ups and texture-visible mediums."   # Dan-Kieft L106-117
  retag_every_shot: "Each shot in a multi-shot prompt is effectively a cold generation — re-introduce every reference at first mention per shot with an identity noun ('the cavewoman image1'), then pronouns within the shot; never rely on shot 1's binding carrying to shot 2."   # Dan-Kieft L99-101
  object_turnaround_sheets: "CONFLICTS WITH D9 (no engineered refs beyond characters — re-litigation is a user call): Dan gives every RECURRING prop/vehicle/creature its own turnaround sheet and tags it per shot; his measured failure (TV vanishing mid-scene) came precisely from an untagged recurring object."   # Dan-Kieft L476-505 + video 8:38-9:52

