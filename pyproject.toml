[project]
name = "ai-content-generation"
version = "0.1.0"
description = "AI-driven viral content generation pipeline with RAG, ML virality prediction, agent orchestration, and LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core app
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "click>=8.3.1",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.46",
    "jinja2>=3.1.4",
    "uvicorn[standard]>=0.32.0",
    "rq>=2.0.0",
    "redis>=5.2.0",
    # LLM SDKs + structured output
    "anthropic>=0.40.0",
    "openai>=1.60.0",
    "instructor>=1.7.0",
    # Observability
    "langfuse>=2.57.0",
    # RAG / embeddings / retrieval
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3.0",
    "rank-bm25>=0.2.2",
    "open-clip-torch>=2.29.0",
    "FlagEmbedding>=1.3.0",
    # ML — classical
    "lightgbm>=4.5.0",
    "scikit-learn>=1.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.5",
    "pyarrow>=17,<19",                       # Win+py3.13 native-ABI stability; pyarrow>=20 crashes on import
    # ML — deep learning (CUDA wheels pinned via [tool.uv.sources] below)
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "transformers>=4.47.0",
    # Fine-tuning
    "peft>=0.14.0",
    "trl>=0.13.0",
    "datasets>=3.2.0",
    "accelerate>=1.2.0",
    # Safety / guardrails
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Agents
    "langgraph>=0.2.0",
    # Postgres driver (pgvector + async)
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "ipykernel>=6.29.0",
]
